name: Build and tests
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
  packages: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: HomeLinkEnergy
    env:
      GITHUB_ACTOR: ${{ github.actor }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      HOMELINK_PACKAGES_TOKEN: ${{ secrets.HOMELINK_PACKAGES_TOKEN || secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          path: HomeLinkEnergy
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: LKDM7/HomeCore
          ref: dbcd1dc9fe694796780498ef1628903c89f6d04f
          path: HomeCore
          token: ${{ secrets.HOMELINK_REPOSITORIES_TOKEN || github.token }}
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build, unit tests and release archive
        run: bash gradlew build test verifyReleaseJar -PuseLocalDependencies=true --no-daemon --no-configuration-cache
      - name: Server GameTests
        run: bash gradlew runGameTestServer -PuseLocalDependencies=true --no-daemon --no-configuration-cache
      - name: Stage the exact HomeCore dependency locally
        run: bash ../HomeCore/gradlew -p ../HomeCore publishMavenJavaPublicationToStagingRepository --no-daemon --no-configuration-cache
      - name: Stage Maven publication
        run: bash gradlew publishMavenJavaPublicationToStagingRepository -PuseLocalDependencies=true --no-daemon --no-configuration-cache
      - name: Resolve staged publication in an independent consumer
        run: bash gradlew -p .github/publication-smoke verifyPublishedArtifacts -Phomecore_staging_repo="${{ github.workspace }}/HomeCore/build/staging-repository" --no-daemon --no-configuration-cache
      - name: Preserve reports and GameTest logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: energy-validation
          path: |
            HomeLinkEnergy/build/reports/
            HomeLinkEnergy/build/test-results/
            HomeLinkEnergy/build/gametest/logs/
            HomeLinkEnergy/build/persistence/logs/
            HomeLinkEnergy/build/validation/**/logs/
            HomeCore/build/reports/
      - name: Preserve release JARs separately
        uses: actions/upload-artifact@v4
        with:
          name: energy-jars
          path: HomeLinkEnergy/build/libs/*.jar
