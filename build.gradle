plugins {
    id 'java-library'
    id 'maven-publish'
    id 'idea'
    id 'net.neoforged.moddev' version '2.0.147'
    id 'net.darkhax.curseforgegradle' version '1.1.28'
}
version = mod_version
group = mod_group_id
base { archivesName = mod_id }
java.toolchain.languageVersion = JavaLanguageVersion.of(21)
repositories {
    maven {
        name = 'HomeCorePackages'
        url = uri('https://maven.pkg.github.com/LKDM7/HomeCore')
        credentials {
            username = providers.gradleProperty('githubUser').orElse(providers.environmentVariable('GITHUB_ACTOR')).getOrElse('')
            password = providers.gradleProperty('githubToken').orElse(providers.environmentVariable('HOMELINK_PACKAGES_TOKEN')).orElse(providers.environmentVariable('GITHUB_TOKEN')).getOrElse('')
        }
        content { includeGroup 'fr.lkdm.homecore' }
    }

    mavenCentral()
    maven { url = 'https://maven.blamejared.com/'; content { includeGroup 'mezz.jei'; includeGroup 'net.mezzdev.config' } }
    maven { url = 'https://maven.shedaniel.me/'; content { includeGroup 'me.shedaniel'; includeGroup 'me.shedaniel.cloth' } }
    maven { url = 'https://maven.architectury.dev/'; content { includeGroup 'dev.architectury' } }
    maven { url = 'https://maven.fabricmc.net/'; content { includeGroup 'net.fabricmc' } }
}
// JEI and REI are optional client integrations: compiled against their APIs, never embedded or required.
// Pass -PwithJei or -PwithRei to load one of them in development runs.
def withJei = providers.gradleProperty('withJei').isPresent()
def withRei = providers.gradleProperty('withRei').isPresent()
dependencies {
    compileOnly "mezz.jei:jei-${minecraft_version}-common-api:${jei_version}"
    compileOnly "mezz.jei:jei-${minecraft_version}-neoforge-api:${jei_version}"
    compileOnly "me.shedaniel:RoughlyEnoughItems-api-neoforge:${rei_version}"
    // Information pages use REI's built-in display type, shipped in the full REI artifact.
    compileOnly("me.shedaniel:RoughlyEnoughItems-neoforge:${rei_version}") { transitive = false }
    // REI annotates its API with net.fabricmc.api.Environment; only that annotation type is needed to compile.
    compileOnly("net.fabricmc:fabric-loader:0.16.14") { transitive = false }
    if (withJei) runtimeOnly "mezz.jei:jei-${minecraft_version}-neoforge:${jei_version}"
    if (withRei) runtimeOnly "me.shedaniel:RoughlyEnoughItems-neoforge:${rei_version}"
    implementation "fr.lkdm.homecore:homecore:${homecore_version}"
    testImplementation 'org.junit.jupiter:junit-jupiter:5.11.4'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}
tasks.named('test', Test) {
    useJUnitPlatform()
    systemProperty 'energy.reportDir', layout.buildDirectory.dir('reports').get().asFile.absolutePath
    testLogging { events 'failed', 'skipped' }
}
// Development-only GameTests and client checks, shipped as a separate mod that never enters the release JAR.
sourceSets {
    verification {
        compileClasspath += sourceSets.main.output
        runtimeClasspath += sourceSets.main.output
    }
}
configurations {
    verificationImplementation.extendsFrom implementation
    verificationRuntimeOnly.extendsFrom runtimeOnly
    verificationCompileOnly.extendsFrom compileOnly
}
neoForge {
    version = project.neo_version
    addModdingDependenciesTo sourceSets.verification
    mods {
        "${mod_id}" { sourceSet sourceSets.main }
        energy_validation { sourceSet sourceSets.verification }
    }
    unitTest {
        enable()
        testedMod = mods.homelink_energy
        loadedMods = [mods.homelink_energy]
    }
    runs {
        client { client(); loadedMods = [mods.homelink_energy] }
        server { server(); programArgument '--nogui'; loadedMods = [mods.homelink_energy] }
        smoke {
            client()
            systemProperty 'energy.smoke', 'true'
            programArguments.addAll('--width', '1280', '--height', '720')
            loadedMods = [mods.homelink_energy, mods.energy_validation]
            gameDirectory = file('build/validation/client')
        }
        gameTestServer {
            type = 'gameTestServer'
            loadedMods = [mods.homelink_energy, mods.energy_validation]
            gameDirectory = file('build/validation/gametest')
            systemProperty 'neoforge.enabledGameTestNamespaces', 'energy_validation'
            systemProperty 'energy.measureTicks', 'true'
        }
        configureEach { logLevel = org.slf4j.event.Level.INFO }
    }
}
def gameTestProperties = layout.buildDirectory.file('validation/gametest/server.properties')
tasks.named('runGameTestServer') {
    doFirst {
        def config = gameTestProperties.get().asFile
        if (!config.exists()) { config.parentFile.mkdirs(); config.setText('', 'UTF-8') }
    }
}
def smokeOptions = layout.buildDirectory.file('validation/client/options.txt')
def smokeLog = layout.buildDirectory.file('validation/client/logs/latest.log')
def smokeLanguage = providers.gradleProperty('smokeLanguage').getOrElse('fr_fr')
tasks.named('runSmoke') {
    doFirst {
        def options = smokeOptions.get().asFile
        options.parentFile.mkdirs()
        options.setText("onboardAccessibility:false\ntutorialStep:none\npauseOnLostFocus:false\nrenderDistance:6\nsimulationDistance:5\nmaxFps:60\nguiScale:2\nlang:${smokeLanguage}\n", 'UTF-8')
    }
    doLast {
        def log = smokeLog.get().asFile.getText('UTF-8')
        if (!log.contains('ENERGY_SMOKE_OK') || log.contains('ENERGY_SMOKE_FAILED')) {
            throw new GradleException('In-game verification failed: inspect build/validation/client/logs/latest.log')
        }
    }
}
def generateModMetadata = tasks.register('generateModMetadata', ProcessResources) {
    def values = ['minecraft_version_range', 'neo_version_range', 'loader_version_range',
                  'mod_id', 'mod_name', 'mod_license', 'mod_version', 'mod_authors', 'mod_description', 'homecore_version_range', 'jei_version_range', 'rei_version_range']
            .collectEntries { [(it): project.property(it)] }
    inputs.properties values
    expand values
    from 'src/main/templates'
    into layout.buildDirectory.dir('generated/sources/modMetadata')
}
sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata
tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 21
    options.compilerArgs.addAll(['-Xlint:deprecation', '-Xlint:removal', '-Xlint:unchecked'])
}
tasks.withType(Jar).configureEach {
    from('LICENSE') { into 'META-INF' }
    preserveFileTimestamps = false
    reproducibleFileOrder = true
    manifest.attributes('Implementation-Version': mod_version)
}
tasks.named('check') { dependsOn tasks.named('verificationClasses') }
def releaseJar = tasks.named('jar', Jar).flatMap { it.archiveFile }
tasks.register('verifyReleaseJar') {
    dependsOn tasks.named('jar')
    inputs.file releaseJar
    doLast {
        def archive = new java.util.zip.ZipFile(releaseJar.get().asFile)
        try {
            def names = archive.entries().collect { it.name }
            if (names.any { it.startsWith('fr/lkdm/homecore/') || it.startsWith('fr/lkdm/homelink/energy/verification/')
                    || it.startsWith('data/energy_validation/') || it.startsWith('org/junit/') }) {
                throw new GradleException('Dependency, test or validation classes must not be embedded in HomeLink Energy.')
            }
            for (def path : ['fr/lkdm/homelink/energy/HomeLinkEnergy.class', 'META-INF/neoforge.mods.toml', 'META-INF/LICENSE',
                              'assets/homelink_energy/lang/en_us.json', 'assets/homelink_energy/lang/fr_fr.json',
                              'assets/homelink_energy/blockstates/solar_panel_1.json', 'assets/homelink_energy/blockstates/battery_1.json',
                              'fr/lkdm/homelink/energy/wind/WindSavedData.class', 'fr/lkdm/homelink/energy/client/WindTurbineRenderer.class',
                              'assets/homelink_energy/blockstates/wind_turbine_1.json', 'assets/homelink_energy/blockstates/wind_turbine_2.json',
                              'assets/homelink_energy/blockstates/wind_turbine_3.json', 'assets/homelink_energy/models/block/wind_blade.json',
                              'data/homelink_energy/recipe/wind_turbine_2.json', 'data/homelink_energy/recipe/wind_turbine_3.json',
                              'data/homelink_energy/loot_table/blocks/wind_turbine_3.json',
                              'data/homelink_energy/recipe/solar_panel_3.json', 'data/homelink_energy/loot_table/blocks/battery_1.json',
                              'fr/lkdm/homelink/energy/hydro/HydroNetworks.class', 'fr/lkdm/homelink/energy/client/HydroTurbineRenderer.class',
                              'assets/homelink_energy/blockstates/hydro_pump_3.json', 'assets/homelink_energy/blockstates/hydro_turbine.json',
                              'assets/homelink_energy/blockstates/hydro_pipe.json', 'assets/homelink_energy/models/block/hydro_rotor_blade.json',
                              'assets/homelink_energy/sounds.json', 'data/homelink_energy/recipe/hydro_turbine.json',
                              'data/homelink_energy/loot_table/blocks/hydro_turbine.json']) {
                if (!names.contains(path)) throw new GradleException("Missing JAR entry: ${path}")
            }
            def metadata = archive.getInputStream(archive.getEntry('META-INF/neoforge.mods.toml')).withCloseable { it.getText('UTF-8') }
            if (!metadata.contains('modId="homecore"') || metadata.contains('${')) throw new GradleException('Invalid HomeCore dependency metadata.')
        } finally { archive.close() }
    }
}
tasks.named('check') { dependsOn tasks.named('verifyReleaseJar') }

def homecoreJarName = "homecore-${homecore_version}.jar"
tasks.register('releaseBundle', Sync) {
    group = 'build'
    description = 'Collects the mod and its required HomeCore dependency, with installation docs.'
    dependsOn tasks.named('build')
    into layout.buildDirectory.dir('release')
    from(releaseJar)
    from(configurations.runtimeClasspath.filter { it.name == homecoreJarName })
    from('README.md', 'LICENSE')
    from('docs') { into 'docs' }
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
publishing {
    publications {
        register('mavenJava', MavenPublication) {
            artifactId = mod_id
            from components.java
        }
    }
    repositories {
        maven {
            name = 'GitHubPackages'
            url = uri('https://maven.pkg.github.com/LKDM7/HomeLink-Energy')
            credentials {
                username = providers.gradleProperty('githubUser').orElse(providers.environmentVariable('GITHUB_ACTOR')).getOrElse('')
                password = providers.gradleProperty('githubToken').orElse(providers.environmentVariable('GITHUB_TOKEN')).getOrElse('')
            }
        }
    }
}

java.withSourcesJar()
publishing {
    publications.named('mavenJava', MavenPublication) {
        pom {
            name = 'HomeLink Energy'
            description = 'Renewable production, storage and distribution of HomeLink Energy.'
            url = 'https://github.com/LKDM7/HomeLink-Energy'
            licenses { license { name = 'All Rights Reserved' } }
            scm { url = 'https://github.com/LKDM7/HomeLink-Energy'; connection = 'scm:git:https://github.com/LKDM7/HomeLink-Energy.git' }
        }
    }
    repositories {
        maven { name = 'Staging'; url = layout.buildDirectory.dir('staging-repository') }
    }
}
tasks.withType(PublishToMavenRepository).configureEach { dependsOn tasks.named('check') }

def curseForgeVersion = providers.gradleProperty('mod_version').get()
def curseForgePublishRequested = gradle.startParameter.taskNames.any {
    it == 'publishToCurseForge' || it.endsWith(':publishToCurseForge')
}
def curseForgeToken = curseForgePublishRequested
        ? providers.gradleProperty('curseforge_api_token')
                .orElse(providers.environmentVariable('CURSEFORGE_API_TOKEN')).getOrNull()
        : null
if (curseForgePublishRequested && !curseForgeToken?.trim()) {
    throw new GradleException('Set curseforge_api_token in your user Gradle properties or CURSEFORGE_API_TOKEN in the environment.')
}

tasks.register('publishToCurseForge', net.darkhax.curseforgegradle.TaskPublishCurseForge) {
    group = 'publishing'
    description = 'Builds and uploads the HomeLink Energy release JAR to CurseForge project 1725197.'
    dependsOn tasks.named('check')
    // Publishing is excluded from the configuration cache so the API token is never cached.
    notCompatibleWithConfigurationCache('The CurseForge upload reads its API token only when publishing.')

    apiToken = curseForgeToken
    debugMode = providers.gradleProperty('curseforge_dry_run').map { it.toBoolean() }.getOrElse(false)

    def mainFile = upload(1725197, tasks.named('jar'))
    mainFile.displayName = "HomeLink Energy ${curseForgeVersion}"
    mainFile.changelog = "HomeLink Energy ${curseForgeVersion} for Minecraft ${minecraft_version} and NeoForge ${neo_version}."
    mainFile.changelogType = 'markdown'
    mainFile.releaseType = 'release'
    mainFile.addGameVersion(minecraft_version)
    mainFile.addEnvironment('Client', 'Server')
    mainFile.addModLoader('NeoForge')
    mainFile.addRequirement('homecore')
    mainFile.addOptional('jei')
    mainFile.addOptional('roughly-enough-items')
}
